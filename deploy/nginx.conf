# Serves the prerendered SvelteKit site for denfrievilje.dk +
# ole.kristensen.name (one image, two apexes — JS does the palette switching
# by hostname client-side, so the same prerendered tree is served to both).
#
# `adapter-static` produces a fully static tree (every prerendered route is
# an `index.html` under its route path or a `<slug>.html` sibling). The
# fallback page is `index.html` (set in svelte.config.ts) — that's both
# the home page and the SPA shell for routes that aren't prerendered.

server {
    # Port 8080 — site container runs as the unprivileged `nginx` user
    # (UID 101), which can't bind to <1024. Caddy's reverse_proxy upstream
    # is `site:8080` to match.
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # Behind DSM Web Station → Caddy → here. Without these two settings,
    # nginx generates auto-trailing-slash 301 redirects using its own
    # listen port, leaking `:8080` into Location headers and breaking the
    # redirect at the public :443 endpoint. `port_in_redirect off;` strips
    # the port; `absolute_redirect off;` makes Location relative — the
    # browser resolves against the original request URL, sidestepping host
    # and port concerns regardless of how many proxy hops are upstream.
    port_in_redirect off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived immutable caching for hashed static assets. SvelteKit emits
    # `_app/immutable/*` with content-hashed filenames, so a year is safe —
    # a redeploy produces new filenames; old ones get harmlessly replaced.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Content images (gallery, thumbnails) — long cache with revalidation.
    # Filenames aren't content-hashed, so a month with revalidation is the
    # right tradeoff.
    location /content/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Site images + logos.
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Media + fonts: filenames aren't content-hashed; week with revalidation.
    location ~* \.(jpg|jpeg|png|webp|avif|gif|ico|svg|woff2?|eot|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML: no-cache so a redeploy is visible on next navigation without
    # users having to hard-refresh. Each page is tiny (<10 KB gzipped) so
    # this doesn't hurt bandwidth meaningfully.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Pretty-URL handling — mirrors skovby's chain. With trailingSlash
    # = 'always' in +layout.ts, adapter-static emits `<slug>/index.html`
    # (not `<slug>.html` siblings). nginx tries the file, the directory
    # (auto-resolves to /index.html via the `index` directive above), the
    # `.html` sibling shape (defensive — for any future route opting out
    # of trailingSlash), and finally the `/index.html` lookup. The SPA
    # shell at /200.html is the last resort for routes not prerendered.
    # /200.html is kept distinct from the prerendered home page at
    # /index.html per the adapter-static docs ("avoid index.html to
    # avoid conflicting with a prerendered homepage").
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html /200.html;
    }

    # Compression. Both static pre-gzip (if present) and runtime.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Minimal access log on stdout (Docker picks it up).
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
