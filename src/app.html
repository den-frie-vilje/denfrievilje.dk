<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Build provenance — populated by deploy/Dockerfile build args via
		     SvelteKit's app.html env interpolation. Empty string in dev. The
		     post-deploy verify step in build-and-sign.yml polls for the
		     first 8 chars of x-build-sha to confirm the agent rolled out
		     this exact commit. -->
		<meta name="x-build-sha" content="%sveltekit.env.PUBLIC_GIT_SHA%" />
		<meta name="x-build-time" content="%sveltekit.env.PUBLIC_BUILD_TIME%" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<!-- Body class comes from PUBLIC_DOMAIN_MODE so the right palette applies
	     server-side without a hydration flash. `body.bureau` is the actual
	     selector in app.css; the artist value is harmless (no .artist CSS
	     exists). The dev/staging palette toggle keeps body.classList in sync
	     via the $effect in +layout.svelte. -->
	<body class="%sveltekit.env.PUBLIC_DOMAIN_MODE%" data-sveltekit-preload-data="auto">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
